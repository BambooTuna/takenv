services:
  # CLIProxyAPI: Antigravity / Codex / Claude / Grok を OpenAI 互換 API として提供する常駐サービス
  # 上流: https://github.com/router-for-me/CLIProxyAPI (Docker Hub: eceasy/cli-proxy-api)
  # バージョンは mise 管理していた時と同じものに固定する（更新時はここを書き換え）
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.94
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "8317:8317"
    # WSL/Linux で host.docker.internal を解決するための固定エイリアス
    # ホスト側で動く Ollama (docker run した ollama コンテナ側の 11434) 等に到達するために使う
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/.config/cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml
      - ${HOME}/.cli-proxy-api:/root/.cli-proxy-api

  # tmuxui: スマホから tmux セッションを操作する Web UI 常駐サービス
  # 上流: https://github.com/BambooTuna/tmuxui (GHCR: ghcr.io/bambootuna/tmuxui)
  # ホストの tmux socket をマウントするため network_mode: host + UID を合わせる。
  # 認証トークンは .env の TMUXUI_TOKEN で渡す（未設定なら起動失敗）。
  tmuxui:
    image: ghcr.io/bambootuna/tmuxui:latest
    container_name: tmuxui
    restart: unless-stopped
    network_mode: host
    user: "${TMUXUI_UID:-1000}:${TMUXUI_GID:-1000}"
    environment:
      TMUXUI_TOKEN: "${TMUXUI_TOKEN}"
      # filer が pane の CWD (host 側絶対パス) をそのまま読めるよう HOME をホストと一致させる
      HOME: "${HOME}"
    volumes:
      - /tmp/tmux-${TMUXUI_UID:-1000}:/tmp/tmux-${TMUXUI_UID:-1000}
      # filer から pane の CWD をそのまま辿れるよう $HOME 全体を同一パスで read-only マウント
      - ${HOME}:${HOME}:ro
      # upload/create 専用の rw 領域 (~/.tmuxui/uploads/YYYY-MM-DD/ に保存される)
      - ${HOME}/.tmuxui:${HOME}/.tmuxui
      # herdr socket も明示(念のため)
      - ${HOME}/.config/herdr/herdr.sock:${HOME}/.config/herdr/herdr.sock

  # Immich: self-hosted 写真管理 (Google フォト代替)。スマホからは Tailscale 経由で
  # http://desktop:2283 に接続する。写真原本と DB は ~/immich-data (WSL2 ext4 側) に置く。
  # バージョン更新時は IMMICH_VERSION (.env) を書き換える。DB/redis のイメージは
  # 公式リリースの docker-compose.yml に合わせて固定している。
  immich-server:
    profiles: ["immich"]
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      TZ: Asia/Tokyo
      DB_HOSTNAME: immich-db
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ${HOME}/immich-data/library:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-db
      - immich-redis

  # 顔認識・スマート検索用 ML。GTX 1070 Ti (CC 6.1) は要件 (CC >= 5.2) を満たすため CUDA 版。
  # Pascal で不調が出たらイメージタグの -cuda を外して CPU 版に戻す
  immich-machine-learning:
    profiles: ["immich"]
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-cuda
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - immich-model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  immich-redis:
    profiles: ["immich"]
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1

  immich-db:
    profiles: ["immich"]
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${HOME}/immich-data/postgres:/var/lib/postgresql/data
    shm_size: 128mb

  # llama.cpp サーバー (LLM 推論 + 内蔵 Web UI)。モデルは ~/llm-models/ の GGUF を直接マウント。
  # http://localhost:8080 が Web UI 兼 OpenAI 互換 API (/v1/chat/completions)。
  # 起動: docker compose --profile llm up -d llama-server
  # モデル変更や -ngl (GPU 層数) / --tensor-split (GPU 分割比) の調整は command を書き換える。
  # 1070 Ti (Pascal, CC 6.1) は公式 CUDA イメージのサポート下限ギリギリ。動かなければ
  # イメージを ghcr.io/ggml-org/llama.cpp:server (CPU 版) に落として切り分ける。
  llama-server:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/llm-models:/models:ro
    # Lexi 8B (Llama 3.1 系無検閲) Q4_K_M 4.6GB — 1070 Ti 8GB に全層 (-ngl 99) + KV が収まる
    # 14B に戻す場合: -m /models/qwen3-abliterated-14b.Q4_K_M.gguf, --n-gpu-layers 20
    # --jinja は Web UI に tool 定義を露出させ 8B が誤爆するので外す (tool use が欲しい時だけ付ける)
    command: >
      -m /models/Lexi-Uncensored-V2-8B.Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      --ctx-size 16384
      --n-gpu-layers 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  immich-model-cache:
