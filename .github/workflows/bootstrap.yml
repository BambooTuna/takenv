name: bootstrap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # info レベルは /etc/os-release の source 追跡失敗（SC1091）など環境差の指摘のみ
        run: shellcheck -x --severity=warning bootstrap.sh bootstrap-full.sh bootstrap/*.sh

  # ゼロ状態の runner でフル構成 (./bootstrap-full.sh) → make doctor が通ることを検証する。
  # 最小構成 (./bootstrap.sh) は shellcheck ジョブでカバー。
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAKENV_SKIP_CASKS: "1"
      # mise の GitHub API アクセス（github/aqua バックエンド・attestation 検証）が
      # ランナー共有 IP の匿名レート制限に当たるため認証を渡す
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap-full
        run: ./bootstrap-full.sh
      - name: doctor
        run: make doctor
