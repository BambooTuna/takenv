name: bootstrap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bootstrap.sh

  # ゼロ状態の runner で bootstrap.sh → make doctor が通ることを検証する
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAKENV_SKIP_CASKS: "1"
      # mise の GitHub API アクセス（github/aqua バックエンド・attestation 検証）が
      # ランナー共有 IP の匿名レート制限に当たるため認証を渡す
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap
        run: ./bootstrap.sh
      - name: doctor
        run: make doctor
