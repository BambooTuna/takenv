onboarding = false
[ui]
agent_panel_sort = "spaces"
# Cmd+T 相当で即タブを作る（リネームは prefix+shift+t）
prompt_new_tab_name = false

# tmux 時代の Ctrl-a 系の操作感を引き継ぐ
# (c: 新規タブ / x: 閉じる / h,j,k,l: ペイン移動 はデフォルトのまま prefix 配下)
show_agent_labels_on_pane_borders = true
[keys]
prefix = "ctrl+a"
# フォーカス中のペインをズーム / 戻す。0.8.0 ではデフォルト未割当なので明示指定
zoom = "prefix+z"
# スペース間移動（サイドバーの並びに合わせて上下）。wezterm 側から Cmd+Shift+[ / ] で発火する
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# 既存 worktree を開く（デフォルト未割当）。wezterm 側から Cmd+Shift+O で発火する
open_worktree = "prefix+shift+o"

# navigate mode (prefix+w) は vim 風に j/k でスペース選択。
# デフォルトで j/k を使っていたペイン上下移動は矢印キーに退避
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[experimental]
# herdr ペイン内から herdr --remote (リモートマシンへの接続) を許可する
allow_nested = true
# ペインへ画像フレームを送る Kitty graphics 経路を有効化 (herdr-browser プラグイン用)
kitty_graphics = true

pane_history = true
[theme]
name = "terminal"
auto_switch = false
