# ランタイム・CLIツールの宣言（グローバル）
# 追加・更新後は `mise install` で反映する
[tools]
# ランタイム
node = "20"
python = "3.12.13"
go = "1.23.11"
rust = "1.87.0"
java = "openjdk-17"
bun = "1.3.3"

# パッケージマネージャ
pnpm = "10.13.1"
yarn = "1.22.19"

# エディタ・ターミナル
neovim = "0.11.4"
tmux = "3.7b"
lazygit = "0.55.1"
ripgrep = "14.1.1"
# latest だと Mac / Linux 間でサーバー・クライアントのバージョンがずれて
# --remote 接続時に相手サーバーの停止・再導入が走るため固定する
"github:ogulcancelik/herdr" = "0.8.0"

# クラウド・インフラ
awscli = "2.13.37"
gcloud = "565.0.0"
terraform = "1.14.9"
"npm:firebase-tools" = "14.7.0"
sops = "3.12.2"
# ローカルサービスを一時的な https://*.trycloudflare.com で公開するトンネル
"aqua:cloudflare/cloudflared" = "latest"
# Google Workspace 操作 CLI (実行コマンド名は `gog`)
"github:openclaw/gogcli" = "0.34.1"

# 開発補助
lefthook = "2.0.7"
tokei = "12.1.2"

# AIエージェント（Claude Code は bootstrap.sh で公式インストーラから導入）
"npm:@openai/codex" = "latest"
# CLIProxyAPI は docker-compose.yml で管理（eceasy/cli-proxy-api:v7.2.94）
# btop は CPU 用途では mise 版 (musl 静的、GPU_SUPPORT=false) を使う。
# GPU マシンでは scripts/gpu-setup が mise 版を uninstall して apt の GPU 対応版に差し替える。
btop = "latest"
github-cli = "latest"
# ヘッドレスブラウザ (スクショ・DOM解析・クリック等の Web 自動化)
# chromium 本体は `mise x -- playwright install chromium` で ~/.cache/ms-playwright に導入
"npm:playwright" = "latest"
