# ランタイム・CLIツールの宣言（グローバル）
# 追加・更新後は `mise install` で反映する
[tools]
# ランタイム
node = "24.10.0"
python = "3.12.13"
go = "1.23.11"
rust = "1.87.0"
java = "openjdk-17"
bun = "1.3.3"

# パッケージマネージャ
pnpm = "10.13.1"
yarn = "1.22.19"

# エディタ・ターミナル
neovim = "0.11.4"
tmux = "3.7b"
lazygit = "0.55.1"
ripgrep = "14.1.1"
"github:ogulcancelik/herdr" = "latest"

# クラウド・インフラ
awscli = "2.13.37"
gcloud = "565.0.0"
terraform = "1.14.9"
"npm:firebase-tools" = "14.7.0"
sops = "3.12.2"

# 開発補助
lefthook = "2.0.7"
tokei = "12.1.2"

# AIエージェント（Claude Code は bootstrap.sh で公式インストーラから導入）
"npm:@openai/codex" = "latest"
