##### Prefix #####
# prefixキーを C-b から C-a に変更
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Terminal / Color #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256color*:Tc"
# (古い書き方: こちらでも動く場合がある)
set -ga terminal-overrides ",xterm-256color:RGB"

##### Clipboard / passthrough #####
# set-clipboardはmosh経由だとクライアント到達しないためoff。
# yキーは後段でpipe経由にOSC 52発火するので、自発emission不要。
set -g set-clipboard off
set -g allow-passthrough on

##### Mouse #####
# クリックでペイン選択・リサイズ・スクロール
set -g mouse on

##### WezTerm-friendly #####
# フォーカスイベント（weztermなど対応端末向け）
set -g focus-events on
# 複数ペイン/複数クライアントでサイズ安定
setw -g aggressive-resize on

##### Quality of life #####
# 設定リロード（prefix + r）
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# 反応をキビキビ（ESC待ち時間を短く）
set -s escape-time 10

# スクロール履歴
set -g history-limit 200000

# インデックスを 1 始まり（好み）
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# 新規ウィンドウ/分割でカレントディレクトリ引き継ぎ
bind c  new-window  -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

##### Copy-mode (vi) #####
setw -g mode-keys vi
# vで選択開始 / yでコピー
# mosh経由ではtmuxのset-clipboard発火がクライアントに届かないため、
# pipe経由でpane出力として明示的にOSC 52を発火する（mosh通過可能な経路）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '/usr/local/bin/osc52-yank'
# マウスドラッグ選択後は y で明示的にコピー（選択を維持する）
unbind -T copy-mode-vi MouseDragEnd1Pane

##### Pane kill (no confirm) #####
bind x kill-pane

##### Pane navigation: Ctrl+h/j/k/l (tmux <-> nvim 共存) #####
# nvim/vim のときは Ctrl+h/j/k/l を nvim に渡す
# それ以外のときは tmux のペイン移動にする
is_vim="[ '#{pane_current_command}' = 'nvim' ] || [ '#{pane_current_command}' = 'vim' ]"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

##### Zoom #####
# prefix + z でペインを全画面トグル（デフォルト動作）
# prefix なしで Alt+z でもトグルできるようにする
bind -n M-z resize-pane -Z

##### Ops (optional but useful) #####
# 入力を全ペインに同時送信（同期）トグル：prefix + S
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# バックグラウンドで出力があったら通知
setw -g monitor-activity on
set -g visual-activity on

##### Appearance #####
# --- ペインボーダー ---
# 非アクティブは控えめ、アクティブは目立つ色
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7,bold"

# --- 非アクティブペインを暗くする ---
set -g window-style "bg=#1a1b26"
set -g window-active-style "bg=#24283b"

# --- ステータスバー ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# 左: セッション名
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]│ "

# 右: ホスト名・日時
set -g status-right-length 50
set -g status-right "#[fg=#565f89] #h │ %m/%d %H:%M "

# ウィンドウリスト
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
set -g window-status-separator ""

# メッセージ
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"

